<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cátedra · Plataforma de Estudos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap');
  /* === FIX: contraste de textos secundários (WCAG AA) === */
:root{ --text-3: #6a7079 !important; }
/* === fim do fix === */
  /* === FIX: separadores entre grupos da sidebar === */
.nav-label{
  margin-top: 10px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,.07);
}
.nav-label:first-child{
  margin-top: 0;
  padding-top: 7px;
  border-top: none;          /* o primeiro grupo não precisa de linha acima */
}
/* === fim do fix === */
  /* === FIX: suavizar tom de "atrasado" (vermelho -> âmbar) === */
.rev.overdue{ border-left-color: var(--amber) !important; }
/* === fim do fix === */
/* === FIX: header responsivo (mobile) === */
@media (max-width: 820px){
  .topbar{ flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .greeting{ flex: 1 1 auto; min-width: 0; }
}
@media (max-width: 560px){
  .topbar{ padding: 14px 16px; }
  .greeting h2{ font-size: 20px; line-height: 1.15; }
  .greeting p{ font-size: 12px; }
  .topbar-actions{ width: 100%; justify-content: flex-start; gap: 8px; }
  #quick-log{ flex: 1 1 100%; justify-content: center; order: 5; }
}
/* === fim do fix === */
  /* === FIX: cards KPI em telas estreitas === */
@media (max-width: 420px){
  .kpis{ gap: 10px; }
  .kpi{ padding: 14px 14px; }
  .kpi .kv{ font-size: 24px; }            /* número não estoura mais a coluna */
  .kpi .kc{ width: 26px; height: 26px; margin-bottom: 9px; }
}
/* opcional: 1 coluna em telas mínimas, se preferir cards maiores */
@media (max-width: 340px){
  .kpis{ grid-template-columns: 1fr; }
}
/* === fim do fix === */
  /* === FIX: suavizar valores zerados nos cards de resumo === */
  .stat .sv[data-empty="true"], .kpi .kv[data-empty="true"]{ color: var(--text-3); font-weight: 500; }
  /* === fim do fix === */
  :root{
    --ink:#0e1116;
    --sidebar:#11151b;
    --sidebar-2:#171c24;
    --canvas:#f6f7f5;
    --surface:#ffffff;
    --surface-2:#fbfbfa;
    --border:#e9e9e4;
    --border-2:#deded6;
    --text:#16191e;
    --text-2:#5d6470;
    --text-3:#9aa0a8;
    --on-dark:#eef0f2;
    --on-dark-2:#9aa3b0;
    --on-dark-3:#5b6573;
    --emerald:#0c8a5b;
    --emerald-d:#0a7049;
    --emerald-soft:#e6f5ee;
    --emerald-ring:#bfe6d3;
    --brass:#b08433;
    --brass-soft:#f6efe1;
    --amber:#c2790c;
    --amber-soft:#fbf1df;
    --red:#c0392f;
    --red-soft:#fbeceb;
    --purple:#6b4fbb;
    --purple-soft:#efeaf9;
    --topbar-bg:rgba(246,247,245,.82);
    --r:18px;--r-sm:12px;--r-xs:9px;
    --sh-sm:0 1px 2px rgba(16,22,30,.04),0 1px 3px rgba(16,22,30,.05);
    --sh-md:0 2px 6px rgba(16,22,30,.05),0 8px 24px rgba(16,22,30,.06);
    --sh-lg:0 4px 12px rgba(16,22,30,.06),0 18px 48px rgba(16,22,30,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Hanken Grotesk',sans-serif;background:var(--canvas);color:var(--text);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    display:flex;min-height:100vh;transition:background .3s,color .3s;
  }
  .serif{font-family:'Newsreader',serif;}
  ::selection{background:var(--emerald-ring);}

  /* ====== SIDEBAR ====== */
  .sidebar{
    width:248px;flex-shrink:0;background:var(--sidebar);color:var(--on-dark);
